[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpppools"
version = "0.1.0"
description = "CppPools Python SDK and command-line client"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
cpl = "cpppools.cli:main"

[tool.setuptools]
package-dir = {"" = "sdk/python"}

[tool.setuptools.packages.find]
where = ["sdk/python"]
include = ["cpppools*"]
namespaces = false

[tool.setuptools.package-data]
"cpppools.completions" = ["cpl.bash", "_cpl", "cpl.ps1"]
