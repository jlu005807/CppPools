<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CppPools 三大池子演示</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #dde3ef;
      --text: #1f2937;
      --muted: #5f6b7a;
      --accent: #1d4ed8;
      --accent-soft: #e6eeff;
      --ok: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 14px 40px;
      display: grid;
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .desc {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      margin-top: 12px;
    }

    input, button {
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 9px 11px;
      font-size: 14px;
    }

    input { min-width: 0; }

    button {
      background: var(--accent-soft);
      color: var(--accent);
      cursor: pointer;
      font-weight: 700;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      background: #fafcff;
    }

    .metric .k {
      color: var(--muted);
      font-size: 12px;
    }

    .metric .v {
      margin-top: 4px;
      font-family: Consolas, monospace;
      font-size: 18px;
      color: #0f172a;
    }

    .note {
      margin-top: 8px;
      color: var(--ok);
      font-size: 13px;
    }

    pre {
      margin: 0;
      min-height: 180px;
      max-height: 360px;
      overflow: auto;
      background: #0b1220;
      color: #dbe8ff;
      border-radius: 8px;
      border: 1px solid #202c42;
      padding: 12px;
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 760px) {
      .row { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>CppPools 三大池子 + 网络编程演示</h1>
      <p class="desc">
        该页面仅保留最小操作，重点展示后端 C++ 线程池、内存池、数据库连接池在 HTTP 请求中的协作。
      </p>
      <div class="row">
        <input id="userId" type="number" min="0" value="1" placeholder="输入用户ID（非负整数）" />
        <button class="primary" id="sendBtn">发送单次请求</button>
        <button id="burstBtn">并发请求 x5</button>
      </div>
      <div class="note" id="statusText">状态：等待操作</div>
    </section>

    <section class="card">
      <div class="grid">
        <div class="metric"><div class="k">线程池工作线程</div><div class="v" id="mWorkers">-</div></div>
        <div class="metric"><div class="k">线程池待处理任务</div><div class="v" id="mPending">-</div></div>
        <div class="metric"><div class="k">数据库池空闲/总量</div><div class="v" id="mDb">-</div></div>
        <div class="metric"><div class="k">内存池使用中</div><div class="v" id="mMemInUse">-</div></div>
        <div class="metric"><div class="k">内存池可用</div><div class="v" id="mMemAvail">-</div></div>
        <div class="metric"><div class="k">总请求数</div><div class="v" id="mTotal">-</div></div>
        <div class="metric"><div class="k">平均时延(ms)</div><div class="v" id="mAvg">-</div></div>
        <div class="metric"><div class="k">P95 时延(ms)</div><div class="v" id="mP95">-</div></div>
        <div class="metric"><div class="k">P99 时延(ms)</div><div class="v" id="mP99">-</div></div>
      </div>
    </section>

    <section class="card">
      <p class="desc" style="margin-bottom:8px;">最近一次接口返回（`/api/process` 或错误信息）</p>
      <pre id="output">尚未请求</pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
